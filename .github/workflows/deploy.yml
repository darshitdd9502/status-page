# .github/workflows/deploy.yml
# Generated by CI/CD Pipeline Generator
# Language: Java (Maven) | Pipeline type: build-test-deploy | Deploy target: on-prem-ssh

name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: ${{ vars.REGISTRY }}/myapp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-java-${{ hashFiles('pom.xml') }}

      - name: Install dependencies
        run: mvn -B dependency:go-offline

      - name: Build
        run: mvn -B -DskipTests package

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: 'target/*.jar'

  deployDev:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to on-prem server via SSH/SCP (dev)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          scp -o StrictHostKeyChecking=no $ARTIFACT_PATH deploy@dev.onprem.internal:/opt/myapp/
          ssh -o StrictHostKeyChecking=no deploy@dev.onprem.internal "sudo systemctl restart myapp"
