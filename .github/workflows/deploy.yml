# Language: Java (Maven) | Pipeline type: build-test-deploy | Deploy target: on-prem-ssh

name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-java-${{ hashFiles('pom.xml') }}

      - name: Install dependencies
        run: mvn -B dependency:go-offline

      - name: Build
        run: mvn -B -DskipTests package

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: 'target/*.jar'

  deployDev:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Azure login (OIDC — no stored keys)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload jar to Blob Storage
        run: |
          JAR_PATH=$(find dist -name '*.jar' | head -n1)
          az storage blob upload \
            --account-name spdiagdev3w19xb \
            --container-name artefacts \
            --name statuspage.jar \
            --file "$JAR_PATH" \
            --auth-mode login \
            --overwrite

      - name: Generate short-lived SAS URL for the jar
        id: sas
        run: |
          EXPIRY=$(date -u -d "+20 minutes" '+%Y-%m-%dT%H:%MZ')
          URL=$(az storage blob generate-sas \
            --account-name spdiagdev3w19xb \
            --container-name artefacts \
            --name statuspage.jar \
            --permissions r \
            --expiry "$EXPIRY" \
            --https-only \
            --auth-mode login \
            --as-user \
            --full-uri -o tsv)
          echo "jar_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy to StatusPage VM
        run: |
          az vm run-command invoke \
            --resource-group statuspage-dev-rg \
            --name statuspage-dev-vm \
            --command-id RunPowerShellScript \
            --scripts \
              "if (-not (Test-Path 'C:\Program Files\Eclipse Adoptium')) { Invoke-WebRequest -Uri 'https://api.adoptium.net/v3/binary/latest/26/ga/windows/x64/jre/hotspot/normal/eclipse' -OutFile C:\temurin26.msi; Start-Process msiexec.exe -ArgumentList '/i C:\temurin26.msi /quiet' -Wait }" \
              "New-Item -ItemType Directory -Force -Path C:\apps\statuspage" \
              "Invoke-WebRequest -Uri '${{ steps.sas.outputs.jar_url }}' -OutFile C:\apps\statuspage\statuspage.jar" \
              "if (-not (Test-Path 'C:\apps\statuspage\WinSW.exe')) { Invoke-WebRequest -Uri 'https://github.com/winsw/winsw/releases/latest/download/WinSW-x64.exe' -OutFile C:\apps\statuspage\WinSW.exe; \$xml = '<service><id>StatusPage</id><name>StatusPage</name><executable>java</executable><arguments>-jar C:\apps\statuspage\statuspage.jar</arguments><env name=\"PORT\" value=\"8080\"/><onfailure action=\"restart\"/></service>'; Set-Content -Path C:\apps\statuspage\WinSW.xml -Value \$xml; Set-Location C:\apps\statuspage; .\WinSW.exe install }" \
              "Stop-Service StatusPage -ErrorAction SilentlyContinue" \
              "Start-Service StatusPage"
