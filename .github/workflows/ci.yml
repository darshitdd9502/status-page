# .github/workflows/ci.yml
# Generated by CI/CD Pipeline Generator
# Language: Java (Maven) | Pipeline type: build-test-deploy | Deploy target: on-prem-ssh

name: CI Pipeline

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ vars.REGISTRY }}/myapp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-java-${{ hashFiles('pom.xml') }}

      - name: Install dependencies
        run: mvn -B dependency:go-offline

      - name: Build
        run: mvn -B -DskipTests package

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: 'target/*.jar'
