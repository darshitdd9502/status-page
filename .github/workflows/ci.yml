name: CI — Build, Test & Push

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn clean verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t statuspage:ci .

      - name: Verify Java version in image
        run: |
          docker run --rm statuspage:ci java -version 2>&1 | grep -E '(21|openjdk)'

      - name: Start container and verify health endpoint
        run: |
          docker run -d --name statuspage-test -p 8080:8080 statuspage:ci
          echo "Waiting for application to start..."
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 1s"
            sleep 1
          done
          FINAL=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          docker stop statuspage-test || true
          docker rm statuspage-test || true
          if [ "$FINAL" != "200" ]; then
            echo "Health check failed: HTTP $FINAL"
            exit 1
          fi

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: statuspage:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL